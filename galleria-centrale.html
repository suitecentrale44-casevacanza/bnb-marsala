<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria Foto - Suite Centrale</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="image/Logo_Suite.jpg">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 119, 182, 0.15); }
    h1 { color: #0077b6; margin-bottom: 0.5rem; }
    p { color: #1d3557; margin-bottom: 1.5rem; }
    .btn-torna { display: inline-block; background-color: #1d3557; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 1.5rem; transition: background 0.2s; }
    .btn-torna:hover { background-color: #0077b6; }
    
    /* Griglia delle immagini */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .gallery-grid img { 
      width: 100%; 
      height: 200px; 
      object-fit: cover; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background-color: #e2e8f0; /* Mostra un grigino elegante mentre la foto carica */
    }
    .gallery-grid img:hover { 
      transform: scale(1.03); 
      box-shadow: 0 6px 12px rgba(0,0,0,0.2); 
    }
    
    /* Finestra di ingrandimento (Modal) */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      align-items: center;
      justify-content: center;
    }
    .modal-img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
      user-select: none;
    }
    
    /* Pulsanti di chiusura e navigazione */
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #ffb703; }
    
    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 30px;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s ease;
      z-index: 1001;
      user-select: none;
    }
    .modal-nav:hover { background: rgba(255, 255, 255, 0.5); }
    .modal-prev { left: 20px; }
    .modal-next { right: 20px; }
    
    @media (max-width: 600px) {
      .modal-nav { padding: 8px 15px; font-size: 24px; }
      .modal-prev { left: 5px; }
      .modal-next { right: 5px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-torna">← Torna alla Home</a>
    <h1>Galleria Foto - Suite Centrale</h1>
    <p>Sfoglia le immagini della nostra struttura nel centro storico di Marsala. Clicca su una foto per ingrandirla e usa le frecce per scorrere.</p>

    <div class="gallery-grid" id="galleria-foto"></div>
  </div>

  <!-- Finestra per la foto ingrandita con frecce -->
  <div id="foto-modal" class="modal">
    <span class="modal-close" onclick="chiudiModal()">&times;</span>
    <button class="modal-nav modal-prev" onclick="cambiaFoto(-1)">❮</button>
    <img id="img-ingrandita" class="modal-img" src="" alt="Foto Ingrandita">
    <button class="modal-nav modal-next" onclick="cambiaFoto(1)">❯</button>
  </div>

  <!-- IL NUOVO MOTORE SUPER-VELOCE -->
  <script>
    // ==========================================
    // 1. IMPOSTAZIONI: Modifica solo questi due valori!
    // ==========================================
    const cartella = "image/suite-centrale/";
    const estensione = "jpg"; // Assicurati che le foto finiscano tutte in .jpg (minuscolo)
    
    // Scrivi qui quante foto hai in totale per questa casa!
    const totaleFoto = 15; 
    
    // ==========================================
    // 2. MOTORE DI CARICAMENTO
    // ==========================================
    const contenitore = document.getElementById('galleria-foto');
    const listaFoto = [];
    let fotoAttualeIndex = 0;

    function caricaTutteLeFoto() {
      // Inserisce le foto istantaneamente nella griglia, senza "indovinare"
      for (let i = 1; i <= totaleFoto; i++) {
        const percorso = `${cartella}${i}.${estensione}`;
        listaFoto.push(percorso);

        const elementoImg = document.createElement('img');
        elementoImg.src = percorso;
        elementoImg.alt = `Suite Centrale - Foto ${i}`;
        
        // LA VERA MAGIA È QUI: "lazy" ordina al telefono di non sprecare 
        // internet per le foto in fondo alla pagina finché non ci si arriva!
        elementoImg.loading = "lazy"; 
        
        // Imposta l'azione per il clic
        const indice = i - 1; // Gli array partono da 0
        elementoImg.onclick = function() {
          apriModal(indice);
        };

        contenitore.appendChild(elementoImg);
      }
    }

    // ==========================================
    // 3. GESTIONE DELLA FINESTRA DI INGRANDIMENTO
    // ==========================================
    function apriModal(index) {
      fotoAttualeIndex = index;
      document.getElementById('img-ingrandita').src = listaFoto[fotoAttualeIndex];
      document.getElementById('foto-modal').style.display = 'flex';
    }

    function cambiaFoto(direzione) {
      fotoAttualeIndex += direzione;

      // Crea l'effetto "circolare": se vai oltre l'ultima, torni alla prima
      if (fotoAttualeIndex < 0) {
        fotoAttualeIndex = listaFoto.length - 1;
      } else if (fotoAttualeIndex >= listaFoto.length) {
        fotoAttualeIndex = 0;
      }

      document.getElementById('img-ingrandita').src = listaFoto[fotoAttualeIndex];
    }

    function chiudiModal() {
      document.getElementById('foto-modal').style.display = 'none';
    }

    // Navigazione con la tastiera
    document.addEventListener('keydown', function(event) {
      const modal = document.getElementById('foto-modal');
      if (modal.style.display === 'flex') {
        if (event.key === 'ArrowLeft') cambiaFoto(-1);
        if (event.key === 'ArrowRight') cambiaFoto(1);
        if (event.key === 'Escape') chiudiModal();
      }
    });

    // Avvia la costruzione della galleria all'apertura
    caricaTutteLeFoto();
  </script>

</body>
</html>
